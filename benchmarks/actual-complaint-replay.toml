[app]
start = "cd packages/desktop-client && npx cross-env REACT_APP_BACKEND_WORKER_HASH=dev yarn vite --mode=browser --port {port} --strictPort --host 127.0.0.1"
ready = "/"
ready_text = "Try the demo"
hints = """Actual is a budgeting app. It takes several seconds to load. First screen: press 'Try the demo' to open a demo budget with accounts and transactions.
Desktop: the left sidebar has Budget, Reports, Schedules, 'All accounts' and each account; an account shows its transactions table. Tick transaction checkboxes to select several; a menu above the table then offers bulk edits such as the date. A 'Take the tour' button in the sidebar starts the guided tour.
Phone: the budget opens first; an 'Accounts' tab lists the accounts, and opening one shows its transactions, where new transactions can be added and opened. A transaction has payee, category, amount, date and Cleared/Reconciled switches."""
edit = ["packages/desktop-client/src/**", "packages/loot-core/src/**", "packages/component-library/src/**"]
