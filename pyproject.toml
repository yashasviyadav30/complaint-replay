[project]
name = "complaint-replay"
version = "1.0.0a1"
description = "Reproduce user complaints under their real conditions, fix them with NVIDIA Nemotron, prove the fix, and guard it in CI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "fasttext-predict>=0.9.2.4",
    "openai>=3.29.0",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
crp = "replay.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replay", "server"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
