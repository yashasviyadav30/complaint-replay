[project]
name = "complaint-replay"
version = "1.0.0a1"
description = "Reproduce user complaints under their real conditions, fix them with NVIDIA Nemotron, prove the fix, and guard it in CI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "yashasviyadav30" }]
keywords = ["bug-reproduction", "playwright", "accessibility", "github-actions", "llm-agents", "nemotron", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.143.0",
    "fasttext-predict>=0.9.2.4",
    "openai>=3.29.0",
    "pillow>=11",
    "playwright>=1.63.0",
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/yashasviyadav30/complaint-replay"
Demo = "https://yashasviyadav30.github.io/complaint-replay/"
Issues = "https://github.com/yashasviyadav30/complaint-replay/issues"

[project.scripts]
crp = "replay.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
mcp = [
    "mcp>=2.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replay", "server"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mcp>=2.3",  # tests/test_mcp.py
    "pytest>=9.1.1",
]
