name: Complaint Replay
description: Reproduce a user's complaint under their real conditions, fix it with NVIDIA Nemotron, prove it, and open a PR with a guard test.
branding:
  icon: rotate-ccw
  color: orange
inputs:
  mode:
    description: "replay (reproduce, fix, open a PR) or guard (run every guard test)"
    default: guard
  payload:
    description: The complaint JSON sent by the Complaint Replay service (repository_dispatch client_payload)
    default: ""
  complaint:
    description: "What the user said (when started by hand)"
    default: ""
  user:
    description: "A ready-made user to replay as (when started by hand)"
    default: slow_3g_android
  fix:
    description: Also fix, prove and guard, and open a pull request
    default: "true"
  nebius-api-key:
    description: Nebius Token Factory key (NVIDIA Nemotron models)
    default: ""
  nvidia-api-key:
    description: build.nvidia.com key, used only when no Nebius key is set
    default: ""
  github-token:
    description: Token used to push the fix branch and open the pull request
    default: ${{ github.token }}
  daily-limit:
    description: "Most '/replay' comment runs per day (UTC); 0 = no limit. Keeps a public repo from spending your key"
    default: "20"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - name: Install Complaint Replay
      shell: bash
      run: |
        uv tool install --python 3.13 "complaint-replay @ git+https://github.com/yashasviyadav30/complaint-replay@${{ github.action_ref || 'main' }}"
        crp setup
    - name: Replay the complaint
      if: inputs.mode == 'replay'
      shell: bash
      env:
        NEBIUS_API_KEY: ${{ inputs.nebius-api-key }}
        NVIDIA_API_KEY: ${{ inputs.nvidia-api-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        PAYLOAD: ${{ inputs.payload }}
        COMPLAINT: ${{ inputs.complaint }}
        REPLAY_USER: ${{ inputs.user }}
        FIX: ${{ inputs.fix }}
        DAILY_LIMIT: ${{ inputs.daily-limit }}
      run: |
        args=()
        [ "$FIX" = "true" ] && args+=(--fix --pr)
        if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
          # Read the complaint from the event file, not from an input: inputs are printed in the log, and the
          # payload holds the callback token. Mask it in case anything prints it later.
          python3 -c 'import json,os,sys; p=json.load(open(os.environ["GITHUB_EVENT_PATH"]))["client_payload"]; print("::add-mask::"+p.get("token","")); json.dump(p, open(sys.argv[1],"w"))' "$RUNNER_TEMP/payload.json"
          crp replay --payload "$RUNNER_TEMP/payload.json" "${args[@]}"
        elif [ "$GITHUB_EVENT_NAME" = "issues" ] || [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
          if [ "$GITHUB_EVENT_NAME" = "issue_comment" ] && [ "$DAILY_LIMIT" -gt 0 ]; then
            # Anyone may comment "/replay ..." on a public repo: a daily cap keeps strangers from spending the key.
            today=$(date -u +%Y-%m-%d)
            used=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=issue_comment&created=%3E%3D$today" --jq .total_count)
            if [ "$used" -gt "$DAILY_LIMIT" ]; then
              issue=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["issue"]["number"])')
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Today's limit of $DAILY_LIMIT replays is reached. Try again tomorrow (UTC)."
              exit 0
            fi
          fi
          # A maintainer labelled an issue "replay", or someone commented "/replay [user] what went wrong":
          # that text (else the issue's) is the complaint; a label or the first word can pick the user.
          python3 - "$RUNNER_TEMP" <<'PY'
        import json, os, sys
        event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
        issue = event["issue"]
        users = {"mobile": "slow_3g_android", "screen-reader": "screen_reader", "keyboard": "keyboard",
                 "hindi": "hindi", "arabic": "arabic", "elderly": "elderly", "slow-network": "flaky_network", "iphone": "iphone", "train": "train"}
        labels = [l["name"].lower() for l in issue.get("labels", [])]
        user = next((users[l] for l in labels if l in users), "fast_desktop")
        text = (issue["title"] + chr(10) + (issue.get("body") or ""))[:1500]
        said = (event.get("comment") or {}).get("body", "").strip().removeprefix("/replay").strip()
        first, _, rest = said.partition(" ")
        if first.lower() in users:
            user, said = users[first.lower()], rest.strip()
        if said:
            text = said[:1500]
        open(os.path.join(sys.argv[1], "complaint.txt"), "w", encoding="utf-8").write(text)
        open(os.path.join(sys.argv[1], "user.txt"), "w").write(user)
        open(os.path.join(sys.argv[1], "issue.txt"), "w").write(str(issue["number"]))
        PY
          crp replay "$(cat "$RUNNER_TEMP/complaint.txt")" --user "$(cat "$RUNNER_TEMP/user.txt")"             --issue "$(cat "$RUNNER_TEMP/issue.txt")" "${args[@]}"
        elif [ -n "$PAYLOAD" ] && [ "$PAYLOAD" != "null" ]; then
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/payload.json"
          crp replay --payload "$RUNNER_TEMP/payload.json" "${args[@]}"
        else
          crp replay "$COMPLAINT" --user "$REPLAY_USER" "${args[@]}"
        fi
    - name: Run guard tests (on a pull request, new guards must also fail on the base branch)
      if: inputs.mode == 'guard'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ -n "$BASE_REF" ]; then
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          crp guard --base "origin/$BASE_REF"
        else
          crp guard
        fi
    - name: Keep the evidence
      if: always() && inputs.mode == 'replay'
      uses: actions/upload-artifact@v4
      with:
        name: complaint-replay-${{ github.run_id }}
        path: .complaint-replay/runs/
        if-no-files-found: ignore
